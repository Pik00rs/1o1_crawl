<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Coffre — REACTOR HOLLOW</title>
<style>
  :root {
    --bg-0: #050608;
    --bg-1: #0a0d12;
    --bg-2: #11151c;
    --bg-3: #1a2028;
    --border-1: rgba(255, 255, 255, 0.06);
    --border-2: rgba(255, 255, 255, 0.12);
    --text-0: #e8e8e8;
    --text-1: #a0a0a0;
    --text-2: #606060;
    --accent: #ffb347;
    --r-common: #888888;
    --r-magic: #2a5a9c;
    --r-rare: #b88a1a;
    --r-epic: #6a1a8a;
    --r-legendary: #b85800;
    --r-set: #2a8a4a;
    --r-common-bright: #cccccc;
    --r-magic-bright: #6aaaff;
    --r-rare-bright: #ffcc44;
    --r-epic-bright: #cc44ff;
    --r-legendary-bright: #ff8800;
    --r-set-bright: #66ff66;
    --good: #5fff8c;
    --bad: #ff5959;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-0);
    color: var(--text-0);
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  .header {
    background: var(--bg-1);
    border-bottom: 1px solid var(--border-2);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky; top: 0; z-index: 50;
  }
  .back-btn {
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    padding: 6px 12px;
    color: var(--text-0);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .back-btn:hover { background: var(--bg-3); }
  .title {
    font-size: 16px; letter-spacing: 2px;
    font-weight: bold;
  }
  .title .acc { color: var(--accent); }
  .stats-mini { margin-left: auto; font-size: 11px; color: var(--text-1); display: flex; gap: 12px; }
  .stats-mini b { color: var(--text-0); }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px;
  }

  /* === COMPARISON PANEL === */
  .comparison {
    background: var(--bg-1);
    border: 1px solid var(--border-2);
    margin-bottom: 12px;
    padding: 12px;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    gap: 10px;
  }
  .comparison.empty {
    text-align: center;
    color: var(--text-2);
    padding: 20px;
    font-size: 11px;
    grid-template-columns: 1fr;
  }
  .cmp-side {
    display: flex; flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .cmp-side h3 {
    margin: 0; font-size: 9px; letter-spacing: 2px;
    color: var(--text-2); text-transform: uppercase;
    border-bottom: 1px solid var(--border-1);
    padding-bottom: 4px;
  }
  .cmp-side h3.selected { color: var(--accent); }
  .cmp-side h3.equipped { color: var(--good); }
  .cmp-item {
    display: flex; gap: 8px;
    padding: 4px 0;
  }
  .cmp-item-icon {
    width: 44px; height: 44px;
    background: var(--bg-2);
    border: 2px solid var(--border-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
  }
  .cmp-item-info { flex: 1; min-width: 0; }
  .cmp-item-name {
    font-size: 12px; font-weight: bold;
    margin-bottom: 2px;
    word-break: break-word;
    line-height: 1.2;
  }
  .fav-toggle {
    display: inline-block;
    background: transparent;
    border: 1px solid var(--border-2);
    color: var(--text-2);
    font-size: 13px;
    padding: 0 4px;
    cursor: pointer;
    margin-left: 4px;
    font-family: inherit;
    line-height: 1;
    vertical-align: middle;
  }
  .fav-toggle.on { color: #ffd84d; border-color: #ffd84d; }
  .fav-toggle.off:hover { color: #ffd84d; border-color: #ffd84d; }
  .fav-toggle.locked { cursor: not-allowed; opacity: 0.7; color: #ffd84d; border-color: rgba(255,216,77,0.4); }
  .cmp-item-meta {
    font-size: 10px; color: var(--text-1);
  }
  .cmp-stats { display: flex; flex-direction: column; gap: 2px; }
  .cmp-stat {
    display: flex; justify-content: space-between;
    align-items: center;
    font-size: 10px;
    padding: 2px 0;
    gap: 8px;
  }
  .cmp-stat .lbl { color: var(--text-1); flex: 1; min-width: 0; }
  .cmp-stat .lbl-name { opacity: 0.6; font-size: 9px; margin-left: 4px; }
  .cmp-stat .val { color: var(--text-0); font-weight: bold; flex-shrink: 0; }
  .cmp-stat.base .val { color: #fff; }
  .cmp-stat.implicit .val { color: #aae; }
  .cmp-stat.prefix .val { color: var(--r-magic-bright); }
  .cmp-stat.suffix .val { color: var(--r-epic-bright); }
  .cmp-empty {
    text-align: center; color: var(--text-2);
    font-size: 10px; padding: 20px 8px;
    border: 1px dashed var(--border-2);
  }
  .cmp-divider {
    background: var(--border-2);
  }

  /* === FILTERS === */
  .filter-section {
    background: var(--bg-1);
    border: 1px solid var(--border-2);
    margin-bottom: 10px;
    padding: 8px 10px;
  }
  .filter-row {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
    padding: 3px 0;
    align-items: center;
    overflow: hidden;
  }
  .filter-row + .filter-row { margin-top: 4px; }
  /* La ligne de TRI peut être longue → autorise overflow scroll horizontal sur mobile */
  #filter-sort {
    overflow-x: auto;
    flex-wrap: nowrap;
  }
  #filter-sort::-webkit-scrollbar { height: 3px; }
  #filter-sort::-webkit-scrollbar-thumb { background: var(--border-2); }
  .filter-label {
    font-size: 8px; letter-spacing: 1.5px;
    color: var(--text-2); text-transform: uppercase;
    flex-shrink: 0;
    width: 38px;
  }
  /* SLOT btn — with emoji icon */
  .slot-btn {
    background: var(--bg-2);
    border: 1px solid var(--border-1);
    color: var(--text-1);
    font-family: inherit;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.1s;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    padding: 0;
  }
  .slot-btn:hover { background: var(--bg-3); border-color: var(--border-2); }
  .slot-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }
  .slot-btn.all {
    font-size: 12px;
    font-weight: bold;
  }
  /* RARITY btn — colored square, no text */
  .rarity-btn {
    width: 28px; height: 28px;
    border: 2px solid transparent;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.1s;
    padding: 0;
    position: relative;
  }
  .rarity-btn.r-all {
    background: linear-gradient(135deg,
      var(--r-common-bright) 0%, var(--r-common-bright) 20%,
      var(--r-magic-bright) 20%, var(--r-magic-bright) 40%,
      var(--r-rare-bright) 40%, var(--r-rare-bright) 60%,
      var(--r-epic-bright) 60%, var(--r-epic-bright) 80%,
      var(--r-legendary-bright) 80%);
  }
  .rarity-btn.r-common    { background: var(--r-common-bright); }
  .rarity-btn.r-magic     { background: var(--r-magic-bright); }
  .rarity-btn.r-rare      { background: var(--r-rare-bright); }
  .rarity-btn.r-epic      { background: var(--r-epic-bright); }
  .rarity-btn.r-legendary { background: var(--r-legendary-bright); }
  .rarity-btn:hover { transform: scale(1.1); }
  .rarity-btn.active {
    border-color: var(--text-0);
    box-shadow: 0 0 0 1px var(--accent);
  }
  /* ILVL btn — small square with roman numeral. 11 boutons sur 1 seule ligne. */
  .ilvl-btn {
    background: var(--bg-2);
    border: 1px solid var(--border-1);
    color: var(--text-1);
    font-family: inherit;
    cursor: pointer;
    flex-shrink: 1;
    flex-grow: 0;
    flex-basis: 26px;
    transition: all 0.1s;
    width: 26px;
    height: 26px;
    min-width: 0;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 0.5px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ilvl-btn:hover { background: var(--bg-3); border-color: var(--border-2); }
  .ilvl-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }
  .ilvl-btn.all {
    font-size: 11px;
  }
  /* SORT btn — pour les tris récent / tier / rareté */
  .sort-btn {
    background: var(--bg-2);
    border: 1px solid var(--border-1);
    color: var(--text-1);
    font-family: inherit;
    cursor: pointer;
    transition: all 0.1s;
    height: 26px;
    padding: 0 8px;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 0.5px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }
  .sort-btn:hover {
    background: var(--bg-3);
    border-color: var(--border-2);
    color: var(--text-0);
  }
  .sort-btn.active {
    background: rgba(95, 255, 140, 0.15);
    border-color: var(--good);
    color: var(--good);
  }
  .search-input {
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    color: var(--text-0);
    padding: 5px 8px;
    font-family: inherit;
    font-size: 11px;
    width: 100%;
    margin-bottom: 6px;
  }

  /* === ACTION BAR === */
  .action-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .action-btn {
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    color: var(--text-0);
    padding: 6px 10px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .action-btn:hover:not(:disabled) { background: var(--bg-3); }
  .action-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .action-btn.primary {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: bold;
  }
  .action-btn.primary:disabled {
    background: var(--bg-2);
    color: var(--text-2);
    border-color: var(--border-2);
  }
  .action-btn.danger {
    border-color: var(--bad);
    color: var(--bad);
  }
  .action-btn.danger:hover:not(:disabled) {
    background: var(--bad);
    color: #000;
  }
  .selection-count {
    font-size: 10px; color: var(--text-1);
    margin-left: auto;
  }
  .selection-count b { color: var(--accent); }

  /* === GRID === 8 COLS, COLORED BG, SLOT ICON */
  .grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    margin-bottom: 12px;
  }
  .item-cell {
    aspect-ratio: 1;
    border: 2px solid rgba(0, 0, 0, 0.3);
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: all 0.1s;
    overflow: hidden;
    color: inherit;
    font-family: inherit;
  }
  .item-cell:hover {
    transform: scale(1.05);
    z-index: 2;
  }
  .item-cell.selected {
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 2px var(--accent), 0 0 12px rgba(255, 179, 71, 0.6);
    z-index: 3;
  }
  /* Item équipé : double-bordure verte + badge "EQ" */
  .item-cell.equipped {
    box-shadow: inset 0 0 0 2px rgba(95, 255, 140, 0.5);
  }
  .item-cell.equipped.selected {
    box-shadow: inset 0 0 0 2px rgba(95, 255, 140, 0.5), 0 0 0 2px var(--accent), 0 0 12px rgba(255, 179, 71, 0.6);
  }
  .item-cell .eq-badge {
    position: absolute;
    top: 2px;
    left: 2px;
    font-size: 7px;
    font-weight: bold;
    background: rgba(95, 255, 140, 0.9);
    color: #000;
    padding: 1px 3px;
    letter-spacing: 0.5px;
    line-height: 1;
    border-radius: 1px;
    z-index: 4;
  }
  /* Item favori : étoile en haut à droite */
  .item-cell .fav-badge {
    position: absolute;
    top: 2px;
    right: 2px;
    font-size: 11px;
    color: #ffd84d;
    text-shadow: 0 0 4px rgba(0,0,0,0.8), 0 0 6px rgba(255,216,77,0.6);
    line-height: 1;
    z-index: 4;
  }
  .item-cell.empty {
    cursor: default;
    background: var(--bg-1);
    border-color: var(--border-1);
    opacity: 0.3;
    pointer-events: none;
  }
  /* Rarity backgrounds (darker, matte) */
  .item-cell.r-common    { background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%); border-color: #444; }
  .item-cell.r-magic     { background: linear-gradient(135deg, #1a3a6a 0%, #0a2040 100%); border-color: var(--r-magic-bright); }
  .item-cell.r-rare      { background: linear-gradient(135deg, #6a4a0a 0%, #3a2800 100%); border-color: var(--r-rare-bright); }
  .item-cell.r-epic      { background: linear-gradient(135deg, #4a1a6a 0%, #2a0a3a 100%); border-color: var(--r-epic-bright); }
  .item-cell.r-legendary { background: linear-gradient(135deg, #8a3a00 0%, #4a1a00 100%); border-color: var(--r-legendary-bright); }
  .item-cell.r-set       { background: linear-gradient(135deg, #1a5a2a 0%, #0a2a1a 100%); border-color: var(--r-set-bright); }

  .item-icon {
    font-size: 28px;
    line-height: 1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
  }
  .item-cell .ilvl-badge {
    position: absolute;
    bottom: 2px;
    left: 0; right: 0;
    text-align: center;
    font-size: 9px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 0.5px;
    text-shadow: 0 0 3px rgba(0,0,0,1), 0 0 2px rgba(0,0,0,1);
    line-height: 1;
  }
  .item-cell.r-common .ilvl-badge { color: #ddd; }

  /* === PAGINATION === */
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    padding: 10px;
    background: var(--bg-1);
    border: 1px solid var(--border-2);
  }
  .pag-btn {
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    color: var(--text-0);
    padding: 5px 12px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .pag-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .pag-info { font-size: 11px; color: var(--text-1); }

  /* === DEV TOOLS === */
  .dev-tools {
    background: rgba(255, 0, 100, 0.05);
    border: 1px dashed rgba(255, 0, 100, 0.3);
    padding: 6px 10px;
    margin-top: 12px;
    font-size: 9px;
    color: rgba(255, 100, 150, 0.8);
  }
  .dev-tools button {
    background: rgba(255, 0, 100, 0.1);
    border: 1px solid rgba(255, 0, 100, 0.3);
    color: rgba(255, 100, 150, 1);
    padding: 3px 6px;
    font-family: inherit;
    font-size: 9px;
    cursor: pointer;
    margin-right: 4px;
    margin-bottom: 4px;
  }

  /* === MOBILE === */
  @media (max-width: 700px) {
    .container { padding: 8px; max-width: 100%; }
    .grid { gap: 3px; }
    .item-icon { font-size: 24px; }
    .item-cell .ilvl-badge { font-size: 8px; }
    /* Comparison reste horizontale - shrink les éléments */
    .comparison { padding: 8px; gap: 6px; }
    .cmp-item { gap: 6px; padding: 2px 0; }
    .cmp-item-icon { width: 36px; height: 36px; font-size: 22px; }
    .cmp-item-name { font-size: 11px; }
    .cmp-item-meta { font-size: 9px; }
    .cmp-stat { font-size: 9px; padding: 1px 0; }
    .cmp-stat .lbl-name { display: none; }
    .cmp-side h3 { font-size: 8px; }
    .stats-mini { display: none; }
    .title { font-size: 13px; }
    .filter-label { width: 32px; font-size: 7px; }
    .slot-btn, .rarity-btn { width: 24px; height: 24px; }
    .ilvl-btn { width: 22px; height: 22px; flex-basis: 22px; font-size: 9px; }
    .sort-btn { height: 24px; padding: 0 6px; font-size: 9px; }
  }
  @media (max-width: 480px) {
    .grid { gap: 2px; }
    .item-icon { font-size: 20px; }
    .item-cell .ilvl-badge { font-size: 7px; }
    /* Très petit écran : compact extreme mais reste horizontal */
    .comparison { padding: 6px; gap: 4px; }
    .cmp-item-icon { width: 32px; height: 32px; font-size: 18px; }
    .cmp-item-name { font-size: 10px; line-height: 1.1; }
    .cmp-item-meta { font-size: 8px; }
    .cmp-stat { font-size: 8px; }
    .cmp-stat .lbl { font-size: 8px; }
    .cmp-side h3 { font-size: 7px; padding-bottom: 2px; }
    .filter-label { width: 26px; font-size: 6px; }
    .slot-btn, .rarity-btn { width: 22px; height: 22px; font-size: 12px; }
    .ilvl-btn { width: 20px; height: 20px; flex-basis: 20px; font-size: 8px; }
    .filter-row { gap: 2px; }
    .sort-btn { height: 22px; padding: 0 5px; font-size: 8px; }
  }
  @media (max-width: 360px) {
    .item-icon { font-size: 18px; }
    .ilvl-btn { width: 18px; height: 18px; flex-basis: 18px; font-size: 7px; }
    .slot-btn, .rarity-btn { width: 20px; height: 20px; font-size: 11px; }
    .filter-label { width: 22px; }
  }
</style>
</head>
<body>

<header class="header">
  <a href="../../index.html" class="back-btn">← RETOUR</a>
  <div class="title"><span class="acc">▣</span> COFFRE</div>
  <div class="stats-mini" id="stats-mini"></div>
</header>

<main class="container">

  <!-- FILTERS -->
  <section class="filter-section">
    <input type="text" class="search-input" id="search" placeholder="Rechercher...">
    <div class="filter-row" id="filter-slot"></div>
    <div class="filter-row" id="filter-rarity"></div>
    <div class="filter-row" id="filter-ilvl"></div>
    <div class="filter-row" id="filter-sort">
      <span class="filter-label">TRI</span>
      <button class="sort-btn" data-sort="recent">⏰ Récent</button>
      <button class="sort-btn" data-sort="ilvl-desc">↓ Tier</button>
      <button class="sort-btn" data-sort="ilvl-asc">↑ Tier</button>
      <button class="sort-btn" data-sort="rarity-desc">↓ Rareté</button>
      <button class="sort-btn" data-sort="rarity-asc">↑ Rareté</button>
    </div>
  </section>

  <!-- ACTION BAR -->
  <div class="action-bar">
    <button class="action-btn" id="btn-select-all">▣ TOUT SÉLECT.</button>
    <button class="action-btn" id="btn-deselect" disabled>✕ DÉSÉL.</button>
    <button class="action-btn primary" id="btn-equip" disabled>⚔ ÉQUIPER</button>
    <button class="action-btn danger" id="btn-destroy" disabled>🔥 DÉTRUIRE</button>
    <div class="selection-count" id="selection-count"></div>
  </div>

  <!-- COMPARISON PANEL (entre filtres et grid) -->
  <section class="comparison empty" id="comparison">
    <div style="grid-column: 1/-1; text-align: center; color: var(--text-2); padding: 14px; font-size: 11px; letter-spacing: 1px;">
      Sélectionne un item pour voir la comparaison
    </div>
  </section>

  <!-- GRID -->
  <section class="grid" id="grid"></section>

  <!-- PAGINATION -->
  <div class="pagination">
    <button class="pag-btn" id="pag-prev">◂</button>
    <div class="pag-info" id="pag-info">PAGE 1 / 1</div>
    <button class="pag-btn" id="pag-next">▸</button>
  </div>

  <!-- DEV TOOLS -->
  <div class="dev-tools">
    [DEV] :
    <button id="dev-add-50">+50 random</button>
    <button id="dev-add-10-legendary">+10 légendaires</button>
    <button id="dev-clear">Vider chest</button>
    <button id="dev-reset-equipped">Reset équip.</button>
  </div>

</main>

<script type="module">
import { requireAuth } from './auth.js';
import { injectUserBar } from './user-bar.js';
import { loadChest as apiLoadChest, saveChest as apiSaveChest,
         loadEquipped as apiLoadEquipped, saveEquipped as apiSaveEquipped } from './api.js';
import { refreshMeta, isFavorite, toggleFavorite, isInAnyBuild, canDelete, getBuildsContainingItem } from './player-meta.js';

// Garde d'auth : redirige vers login si non connecté
const _ok = await requireAuth();
if(!_ok) { throw new Error('redirected to login'); }
await refreshMeta();
injectUserBar();
import {
  loadCatalog, getItem, getAllItems,
  rollItem, composeItemName, describeItemStats, ilvlToRoman
} from './items-catalog.js';

// === STATE ===
const STATE = {
  chest: [],
  equipped: {},
  selectedIds: new Set(),
  filter: { slot: 'all', rarity: 'all', ilvl: 'all', search: '' },
  sort: 'recent', // 'recent' | 'ilvl-asc' | 'ilvl-desc' | 'rarity-desc' | 'rarity-asc'
  page: 1,
  itemsPerPage: 40,
  focusedItemId: null,
};

const STORAGE_CHEST = 'rh_player_chest';
const STORAGE_EQUIPPED = 'rh_player_equipped';

const HERO_SLOTS = ['mainhand', 'offhand', 'head', 'chest', 'legs', 'gloves', 'boots', 'amulet', 'ring'];

const SLOT_LABELS = {
  all: 'Tous',
  mainhand: 'Arme',
  offhand: 'Off-hand',
  head: 'Tête',
  chest: 'Torse',
  legs: 'Jambes',
  gloves: 'Mains',
  boots: 'Pieds',
  amulet: 'Amulette',
  ring: 'Anneau',
};

// Icône qui représente le SLOT (pas l'item lui-même)
const SLOT_ICONS = {
  mainhand: '⚔️',
  offhand: '🛡️',
  head: '🪖',
  chest: '🦺',
  legs: '👖',
  gloves: '🧤',
  boots: '👢',
  amulet: '📿',
  ring: '💍',
};

const RARITIES = ['common', 'magic', 'rare', 'epic', 'legendary'];
const RARITY_LABELS = {
  all: 'Toutes', common: 'Commun', magic: 'Magique',
  rare: 'Rare', epic: 'Épique', legendary: 'Légendaire',
};

// === BOOT ===
async function boot(){
  await loadCatalog();
  await loadFromStorage();
  if(STATE.chest.length === 0){
    // Coffre vide à la première connexion : on NE seed PAS, l'utilisateur part de zéro.
    // (Les anciens "mocks" sont retirés du flow Supabase.)
  }
  buildFilterButtons();
  attachEventHandlers();
  render();
}

async function loadFromStorage(){
  STATE.chest = await apiLoadChest();
  STATE.equipped = await apiLoadEquipped();
}

async function saveChest(){ await apiSaveChest(STATE.chest); }
async function saveEquipped(){ await apiSaveEquipped(STATE.equipped); }

function seedChestWithMocks(){
  const catalog = getAllItems();
  const ids = Object.keys(catalog);
  if(ids.length === 0) return;
  const rarities = ['common', 'common', 'magic', 'magic', 'rare', 'epic'];
  for(let i = 0; i < 25; i++){
    const id = ids[Math.floor(Math.random() * ids.length)];
    const rarity = rarities[Math.floor(Math.random() * rarities.length)];
    const ilvl = 1 + Math.floor(Math.random() * 6);
    const rolled = rollItem(id, { rarity, ilvl });
    if(rolled) STATE.chest.push(rolled);
  }
}

function seedEquipped(){
  const catalog = getAllItems();
  const findFirstForSlot = (slot) => Object.keys(catalog).find(id => catalog[id].slot === slot);
  const seedSlot = (heroSlot) => {
    const id = findFirstForSlot(heroSlot);
    if(id){
      const rolled = rollItem(id, { rarity: 'common', ilvl: 1 });
      if(rolled) STATE.equipped[heroSlot] = rolled;
    }
  };
  seedSlot('mainhand');
  seedSlot('head');
  seedSlot('chest');
  seedSlot('legs');
  seedSlot('gloves');
  seedSlot('boots');
  seedSlot('amulet');
  seedSlot('ring');
}

// === FILTER BUILDERS ===
function buildFilterButtons(){
  // SLOT — icons only (with "all" as text)
  const slotRow = document.getElementById('filter-slot');
  slotRow.innerHTML = '<span class="filter-label">SLOT</span>';
  // 'all' button first
  const allBtn = document.createElement('button');
  allBtn.className = 'slot-btn all active';
  allBtn.textContent = 'A';
  allBtn.dataset.slot = 'all';
  allBtn.title = 'Tous les slots';
  allBtn.addEventListener('click', () => onSlotFilterClick('all'));
  slotRow.appendChild(allBtn);
  // Slot icons
  ['mainhand', 'offhand', 'head', 'chest', 'legs', 'gloves', 'boots', 'amulet', 'ring'].forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'slot-btn';
    btn.innerHTML = SLOT_ICONS[s];
    btn.dataset.slot = s;
    btn.title = SLOT_LABELS[s];
    btn.addEventListener('click', () => onSlotFilterClick(s));
    slotRow.appendChild(btn);
  });

  // RARITY — colored squares only
  const rarRow = document.getElementById('filter-rarity');
  rarRow.innerHTML = '<span class="filter-label">RARETÉ</span>';
  const rarAll = document.createElement('button');
  rarAll.className = 'rarity-btn r-all active';
  rarAll.dataset.rarity = 'all';
  rarAll.title = 'Toutes';
  rarAll.addEventListener('click', () => onRarityFilterClick('all'));
  rarRow.appendChild(rarAll);
  RARITIES.forEach(r => {
    const btn = document.createElement('button');
    btn.className = `rarity-btn r-${r}`;
    btn.dataset.rarity = r;
    btn.title = RARITY_LABELS[r];
    btn.addEventListener('click', () => onRarityFilterClick(r));
    rarRow.appendChild(btn);
  });

  // ILVL — small squares with roman numerals
  const ilvlRow = document.getElementById('filter-ilvl');
  ilvlRow.innerHTML = '<span class="filter-label">ILVL</span>';
  const ilvlAll = document.createElement('button');
  ilvlAll.className = 'ilvl-btn all active';
  ilvlAll.textContent = 'A';
  ilvlAll.dataset.ilvl = 'all';
  ilvlAll.title = 'Tous les iLvl';
  ilvlAll.addEventListener('click', () => onIlvlFilterClick('all'));
  ilvlRow.appendChild(ilvlAll);
  for(let lv = 1; lv <= 10; lv++){
    const btn = document.createElement('button');
    btn.className = 'ilvl-btn';
    btn.textContent = ilvlToRoman(lv);
    btn.dataset.ilvl = lv;
    btn.addEventListener('click', () => onIlvlFilterClick(lv));
    ilvlRow.appendChild(btn);
  }
}

function onSlotFilterClick(s){
  STATE.filter.slot = s;
  STATE.page = 1;
  document.querySelectorAll('#filter-slot .slot-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.slot === String(s)));
  render();
}
function onRarityFilterClick(r){
  STATE.filter.rarity = r;
  STATE.page = 1;
  document.querySelectorAll('#filter-rarity .rarity-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.rarity === String(r)));
  render();
}
function onIlvlFilterClick(lv){
  STATE.filter.ilvl = lv;
  STATE.page = 1;
  document.querySelectorAll('#filter-ilvl .ilvl-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.ilvl === String(lv)));
  render();
}
function onSortClick(s){
  STATE.sort = s;
  STATE.page = 1;
  document.querySelectorAll('#filter-sort .sort-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.sort === s));
  render();
}

// === EVENT HANDLERS ===
function attachEventHandlers(){
  document.getElementById('search').addEventListener('input', (e) => {
    STATE.filter.search = e.target.value.toLowerCase().trim();
    STATE.page = 1;
    render();
  });

  // Sort buttons (déjà rendus en HTML, juste à brancher)
  document.querySelectorAll('#filter-sort .sort-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.sort === STATE.sort);
    b.addEventListener('click', () => onSortClick(b.dataset.sort));
  });

  document.getElementById('btn-select-all').addEventListener('click', () => {
    const filtered = getFilteredItems();
    filtered.forEach(item => STATE.selectedIds.add(item.instanceId));
    if(filtered.length > 0 && !STATE.focusedItemId) STATE.focusedItemId = filtered[0].instanceId;
    render();
  });

  document.getElementById('btn-deselect').addEventListener('click', () => {
    STATE.selectedIds.clear();
    STATE.focusedItemId = null;
    render();
  });

  document.getElementById('btn-equip').addEventListener('click', () => {
    if(STATE.selectedIds.size !== 1) return;
    const id = [...STATE.selectedIds][0];
    equipItem(id);
  });

  document.getElementById('btn-destroy').addEventListener('click', () => {
    if(STATE.selectedIds.size === 0) return;
    const count = STATE.selectedIds.size;
    const msg = count === 1 ? 'Détruire cet item ?' : `Détruire ${count} items ?`;
    if(!confirm(msg)) return;
    destroySelected();
  });

  document.getElementById('pag-prev').addEventListener('click', () => {
    if(STATE.page > 1){ STATE.page--; render(); }
  });
  document.getElementById('pag-next').addEventListener('click', () => {
    const totalPages = Math.max(1, Math.ceil(getFilteredItems().length / STATE.itemsPerPage));
    if(STATE.page < totalPages){ STATE.page++; render(); }
  });

  // DEV
  document.getElementById('dev-add-50').addEventListener('click', () => {
    const catalog = getAllItems();
    const ids = Object.keys(catalog);
    for(let i = 0; i < 50; i++){
      const id = ids[Math.floor(Math.random() * ids.length)];
      const rarities = ['common', 'common', 'magic', 'magic', 'rare', 'epic'];
      const rarity = rarities[Math.floor(Math.random() * rarities.length)];
      const ilvl = 1 + Math.floor(Math.random() * 10);
      const rolled = rollItem(id, { rarity, ilvl });
      if(rolled) STATE.chest.push(rolled);
    }
    saveChest();
    render();
  });
  document.getElementById('dev-add-10-legendary').addEventListener('click', () => {
    const catalog = getAllItems();
    const ids = Object.keys(catalog);
    for(let i = 0; i < 10; i++){
      const id = ids[Math.floor(Math.random() * ids.length)];
      const rolled = rollItem(id, { rarity: 'legendary', ilvl: 5 + Math.floor(Math.random() * 6) });
      if(rolled) STATE.chest.push(rolled);
    }
    saveChest();
    render();
  });
  document.getElementById('dev-clear').addEventListener('click', () => {
    if(!confirm('Vider tout le chest ?')) return;
    STATE.chest = [];
    STATE.selectedIds.clear();
    STATE.focusedItemId = null;
    saveChest();
    render();
  });
  document.getElementById('dev-reset-equipped').addEventListener('click', () => {
    STATE.equipped = {};
    seedEquipped();
    saveEquipped();
    render();
  });
}

// === ACTIONS ===
function equipItem(instanceId){
  const item = STATE.chest.find(i => i.instanceId === instanceId);
  if(!item) return;
  const tpl = getItem(item.itemId);
  if(!tpl) return;
  const targetSlot = tpl.slot; // 'mainhand', 'offhand', 'head', 'ring', etc.

  // Cas spécial : équiper une arme 2H — déséquipe AUSSI l'offhand
  if(targetSlot === 'mainhand' && tpl.handed === 2){
    const currentMainhand = STATE.equipped.mainhand;
    const currentOffhand = STATE.equipped.offhand;
    if(currentMainhand) STATE.chest.push(currentMainhand);
    if(currentOffhand) STATE.chest.push(currentOffhand);
    STATE.chest = STATE.chest.filter(i => i.instanceId !== instanceId);
    STATE.equipped.mainhand = item;
    delete STATE.equipped.offhand;
  }
  // Cas spécial : équiper une offhand alors qu'une 2H est en mainhand → bloque
  else if(targetSlot === 'offhand'){
    const currentMainhand = STATE.equipped.mainhand;
    const mhTpl = currentMainhand ? getItem(currentMainhand.itemId) : null;
    if(mhTpl && mhTpl.handed === 2){
      alert(`Impossible : ton arme actuelle (${composeItemName(currentMainhand)}) est à 2 mains et occupe l'off-hand.\n\nDéséquipe d'abord l'arme depuis la page Héro.`);
      return;
    }
    const currentOffhand = STATE.equipped.offhand;
    if(currentOffhand) STATE.chest.push(currentOffhand);
    STATE.chest = STATE.chest.filter(i => i.instanceId !== instanceId);
    STATE.equipped.offhand = item;
  }
  // Cas standard : swap de l'item équipé sur le slot cible
  else {
    const currentlyEquipped = STATE.equipped[targetSlot];
    if(currentlyEquipped) STATE.chest.push(currentlyEquipped);
    STATE.chest = STATE.chest.filter(i => i.instanceId !== instanceId);
    STATE.equipped[targetSlot] = item;
  }

  STATE.selectedIds.delete(instanceId);
  STATE.focusedItemId = null;
  saveChest();
  saveEquipped();
  render();
}

function destroySelected(){
  // Exclut les favoris : ils ne peuvent pas être détruits
  const toDestroy = [...STATE.selectedIds].filter(iid => canDelete(iid));
  const protectedCount = STATE.selectedIds.size - toDestroy.length;
  if(toDestroy.length === 0){
    alert('Aucun item à détruire : tous les sélectionnés sont des favoris.\nRetire-les des favoris (★) d\'abord.');
    return;
  }
  STATE.chest = STATE.chest.filter(i => !toDestroy.includes(i.instanceId));
  STATE.selectedIds.clear();
  STATE.focusedItemId = null;
  saveChest();
  render();
  if(protectedCount > 0){
    setTimeout(() => alert(`${toDestroy.length} item(s) détruit(s). ${protectedCount} favori(s) protégé(s) ont été conservés.`), 100);
  }
}

// === FILTERING / SORTING ===
const RARITY_ORDER = { common: 0, magic: 1, rare: 2, epic: 3, legendary: 4 };

function getFilteredItems(){
  const filtered = STATE.chest.filter(item => {
    const tpl = getItem(item.itemId);
    if(!tpl) return false;
    if(STATE.filter.slot !== 'all' && tpl.slot !== STATE.filter.slot) return false;
    if(STATE.filter.rarity !== 'all' && item.rarity !== STATE.filter.rarity) return false;
    if(STATE.filter.ilvl !== 'all' && item.ilvl !== Number(STATE.filter.ilvl)) return false;
    if(STATE.filter.search){
      const name = composeItemName(item).toLowerCase();
      const tplName = (tpl.name || '').toLowerCase();
      if(!name.includes(STATE.filter.search) && !tplName.includes(STATE.filter.search)) return false;
    }
    return true;
  });

  // Tri
  switch(STATE.sort){
    case 'ilvl-asc':
      filtered.sort((a, b) => a.ilvl - b.ilvl || (b.droppedAt || 0) - (a.droppedAt || 0));
      break;
    case 'ilvl-desc':
      filtered.sort((a, b) => b.ilvl - a.ilvl || (b.droppedAt || 0) - (a.droppedAt || 0));
      break;
    case 'rarity-desc':
      filtered.sort((a, b) => (RARITY_ORDER[b.rarity] || 0) - (RARITY_ORDER[a.rarity] || 0));
      break;
    case 'rarity-asc':
      filtered.sort((a, b) => (RARITY_ORDER[a.rarity] || 0) - (RARITY_ORDER[b.rarity] || 0));
      break;
    case 'recent':
    default:
      filtered.sort((a, b) => (b.droppedAt || 0) - (a.droppedAt || 0));
      break;
  }
  return filtered;
}

// === RENDER ===
function render(){
  renderStatsMini();
  renderGrid();
  renderPagination();
  renderActionBar();
  renderComparison();
}

function renderStatsMini(){
  const el = document.getElementById('stats-mini');
  el.innerHTML = `
    <span><b>${STATE.chest.length}</b> items</span>
    <span><b>${getFilteredItems().length}</b> visibles</span>
  `;
}

// Check si un item est équipé (vérifie tous les slots du héro)
function isItemEquipped(instanceId){
  return Object.values(STATE.equipped).some(it => it?.instanceId === instanceId);
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const filtered = getFilteredItems();
  const start = (STATE.page - 1) * STATE.itemsPerPage;
  const pageItems = filtered.slice(start, start + STATE.itemsPerPage);
  grid.innerHTML = '';
  if(filtered.length === 0){
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-2); padding: 40px; font-size: 12px;">Aucun item ne correspond aux filtres</div>';
    return;
  }
  pageItems.forEach(item => {
    const tpl = getItem(item.itemId);
    if(!tpl) return;
    const equipped = isItemEquipped(item.instanceId);
    const fav = isFavorite(item.instanceId);
    const cell = document.createElement('button');
    cell.className = 'item-cell r-' + item.rarity;
    if(STATE.selectedIds.has(item.instanceId)) cell.classList.add('selected');
    if(equipped) cell.classList.add('equipped');
    if(fav) cell.classList.add('favorited');
    cell.title = composeItemName(item) + (equipped ? ' [ÉQUIPÉ]' : '') + (fav ? ' ★' : '');
    const slotIcon = SLOT_ICONS[tpl.slot] || tpl.icon || '?';
    cell.innerHTML = `
      <span class="item-icon">${slotIcon}</span>
      <span class="ilvl-badge">${ilvlToRoman(item.ilvl)}</span>
      ${equipped ? '<span class="eq-badge">EQ</span>' : ''}
      ${fav ? '<span class="fav-badge">★</span>' : ''}
    `;
    cell.addEventListener('click', () => onCellClick(item));
    grid.appendChild(cell);
  });
  for(let i = pageItems.length; i < STATE.itemsPerPage; i++){
    const cell = document.createElement('div');
    cell.className = 'item-cell empty';
    grid.appendChild(cell);
  }
}

// SINGLE-SELECT au clic. Le multi se fait UNIQUEMENT via "Tout sélectionner".
function onCellClick(item){
  if(STATE.selectedIds.has(item.instanceId) && STATE.selectedIds.size === 1){
    // Re-clic sur l'unique sélectionné = déselection
    STATE.selectedIds.clear();
    STATE.focusedItemId = null;
  } else {
    // Sinon : remplace TOUTE la sélection par cet item
    STATE.selectedIds.clear();
    STATE.selectedIds.add(item.instanceId);
    STATE.focusedItemId = item.instanceId;
  }
  render();
}

function renderPagination(){
  const filtered = getFilteredItems();
  const totalPages = Math.max(1, Math.ceil(filtered.length / STATE.itemsPerPage));
  if(STATE.page > totalPages) STATE.page = totalPages;
  document.getElementById('pag-info').textContent = `PAGE ${STATE.page} / ${totalPages}`;
  document.getElementById('pag-prev').disabled = STATE.page <= 1;
  document.getElementById('pag-next').disabled = STATE.page >= totalPages;
}

function renderActionBar(){
  const count = STATE.selectedIds.size;
  document.getElementById('selection-count').innerHTML = count > 0
    ? `<b>${count}</b> sél.${count > 1 ? '' : ''}` : '';
  document.getElementById('btn-deselect').disabled = count === 0;
  document.getElementById('btn-equip').disabled = count !== 1;
  document.getElementById('btn-destroy').disabled = count === 0;
}

// === COMPARISON ===
function renderComparison(){
  const wrap = document.getElementById('comparison');
  if(!STATE.focusedItemId){
    wrap.classList.add('empty');
    wrap.innerHTML = `
      <div style="grid-column: 1/-1; text-align: center; color: var(--text-2); padding: 18px; font-size: 11px; letter-spacing: 1px;">
        Sélectionne un item pour voir la comparaison
      </div>
    `;
    return;
  }
  const item = STATE.chest.find(i => i.instanceId === STATE.focusedItemId);
  if(!item){
    STATE.focusedItemId = null;
    return renderComparison();
  }
  const tpl = getItem(item.itemId);
  if(!tpl) return;

  const equippedSlot = tpl.slot;
  const equippedItem = STATE.equipped[equippedSlot] || null;

  wrap.classList.remove('empty');
  wrap.innerHTML = `
    <div class="cmp-side">
      <h3 class="selected">▸ SÉLECTIONNÉ</h3>
      ${renderItemCard(item, { interactive: true })}
    </div>
    <div class="cmp-divider"></div>
    <div class="cmp-side">
      <h3 class="equipped">◆ ÉQUIPÉ — ${slotLabel(equippedSlot)}</h3>
      ${equippedItem ? renderItemCard(equippedItem, { interactive: false }) : '<div class="cmp-empty">Aucun item équipé</div>'}
    </div>
  `;

  // Branche le click favori
  wrap.querySelectorAll('.fav-toggle:not([disabled])').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const iid = btn.dataset.favInstance;
      await toggleFavorite(iid);
      renderComparison();
      renderGrid();
      renderActionBar();
    });
  });
}

function slotLabel(slot){
  return SLOT_LABELS[slot] || slot;
}

function renderItemCard(item, opts){
  const tpl = getItem(item.itemId);
  if(!tpl) return '';
  const stats = describeItemStats(item);
  const showFav = opts && opts.interactive;
  const fav = isFavorite(item.instanceId);
  const builds = getBuildsContainingItem(item.instanceId);
  const lockedByBuild = builds.length > 0;
  // Étoile : cliquable (data-attr) si interactive. Si dans un build, on désactive le toggle.
  const favBtn = showFav
    ? `<button class="fav-toggle ${fav ? 'on' : 'off'} ${lockedByBuild ? 'locked' : ''}"
         data-fav-instance="${item.instanceId}"
         title="${lockedByBuild ? `Verrouillé : item dans ${builds.length} build(s)` : (fav ? 'Retirer des favoris' : 'Ajouter aux favoris')}"
         ${lockedByBuild ? 'disabled' : ''}>${fav ? '★' : '☆'}</button>`
    : '';
  return `
    <div class="cmp-item">
      <div class="cmp-item-icon" style="border-color: var(--r-${item.rarity}-bright)">${tpl.icon || '?'}</div>
      <div class="cmp-item-info">
        <div class="cmp-item-name" style="color: var(--r-${item.rarity}-bright)">${composeItemName(item)} ${favBtn}</div>
        <div class="cmp-item-meta">iLvl ${ilvlToRoman(item.ilvl)} · ${RARITY_LABELS[item.rarity] || item.rarity} · ${slotLabel(tpl.slot)}${lockedByBuild ? ` · 🔒 ${builds.map(b => b.name).join(', ')}` : ''}</div>
      </div>
    </div>
    <div class="cmp-stats">
      ${stats.map(s => `
        <div class="cmp-stat ${s.kind}">
          <span class="lbl">${s.label}${s.name ? `<span class="lbl-name">[${s.name}]</span>` : ''}</span>
          <span class="val">${(s.kind === 'prefix' || s.kind === 'suffix' || s.kind === 'implicit') && typeof s.value === 'number' ? '+' : ''}${s.value}</span>
        </div>
      `).join('')}
    </div>
  `;
}

boot().catch(e => {
  console.error('Boot failed:', e);
  document.body.innerHTML = `<div style="padding:40px;color:#ff5959;font-family:monospace;">Erreur de chargement: ${e.message}</div>`;
});
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Grimoire — REACTOR HOLLOW</title>
<style>
  :root {
    --bg-0: #050608;
    --bg-1: #0a0d12;
    --bg-2: #11151c;
    --bg-3: #1a2028;
    --border-1: rgba(255, 255, 255, 0.06);
    --border-2: rgba(255, 255, 255, 0.12);
    --text-0: #e8e8e8;
    --text-1: #a0a0a0;
    --text-2: #606060;
    --accent: #ffb347;
    --good: #5fff8c;
    --bad: #ff5959;
    --fixed: #b78cff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-0);
    color: var(--text-0);
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  .header {
    background: var(--bg-1);
    border-bottom: 1px solid var(--border-2);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky; top: 0; z-index: 50;
  }
  .back-btn {
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    padding: 6px 12px;
    color: var(--text-0);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .back-btn:hover { background: var(--bg-3); }
  .title {
    font-size: 16px; letter-spacing: 2px;
    font-weight: bold;
  }
  .title .acc { color: var(--accent); }
  .stats-mini { margin-left: auto; font-size: 11px; color: var(--text-1); }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 12px;
  }

  /* === GLOBAL CONTROLS === */
  .controls {
    background: var(--bg-1);
    border: 1px solid var(--border-2);
    padding: 10px 12px;
    margin-bottom: 10px;
    position: sticky;
    top: 47px;
    z-index: 40;
  }
  .control-section {
    margin-bottom: 8px;
  }
  .control-section:last-child { margin-bottom: 0; }
  .control-label {
    font-size: 9px; letter-spacing: 2px;
    color: var(--text-2); text-transform: uppercase;
    margin-bottom: 5px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .control-label .val {
    color: var(--accent);
    font-weight: bold;
    font-size: 13px;
  }

  /* iLvl row */
  .ilvl-row {
    display: flex;
    gap: 3px;
    flex-wrap: nowrap;
    overflow: hidden;
  }
  .ilvl-btn {
    background: var(--bg-2);
    border: 1px solid var(--border-1);
    color: var(--text-1);
    font-family: inherit;
    cursor: pointer;
    width: 30px;
    height: 28px;
    flex: 1 1 30px;
    min-width: 0;
    font-size: 11px;
    font-weight: bold;
    padding: 0;
  }
  .ilvl-btn:hover { background: var(--bg-3); border-color: var(--border-2); }
  .ilvl-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  /* Quality slider */
  .slider-container {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .slider-track {
    flex: 1;
    position: relative;
    height: 32px;
    display: flex;
    align-items: center;
  }
  .slider-bg {
    position: absolute;
    inset: 0;
    margin: auto 0;
    height: 6px;
    background: linear-gradient(to right,
      var(--bad) 0%,
      var(--bad) 30%,
      #ffaa44 30%,
      #fff200 60%,
      var(--good) 85%,
      var(--good) 100%);
  }
  input[type="range"].quality-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 32px;
    background: transparent;
    cursor: pointer;
    position: relative;
    z-index: 2;
    margin: 0;
  }
  input[type="range"].quality-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 24px;
    background: var(--text-0);
    border: 2px solid var(--accent);
    cursor: grab;
    box-shadow: 0 0 8px rgba(255, 179, 71, 0.5);
  }
  input[type="range"].quality-slider::-moz-range-thumb {
    width: 16px;
    height: 24px;
    background: var(--text-0);
    border: 2px solid var(--accent);
    cursor: grab;
    box-shadow: 0 0 8px rgba(255, 179, 71, 0.5);
    border-radius: 0;
  }
  .quality-display {
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    padding: 5px 8px;
    min-width: 54px;
    text-align: center;
    font-weight: bold;
    font-size: 13px;
    color: var(--accent);
  }

  /* Preset quality buttons */
  .preset-row {
    display: flex;
    gap: 3px;
    margin-top: 5px;
    flex-wrap: wrap;
  }
  .preset-btn {
    background: var(--bg-2);
    border: 1px solid var(--border-1);
    color: var(--text-1);
    font-family: inherit;
    cursor: pointer;
    padding: 3px 7px;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .preset-btn:hover { background: var(--bg-3); }
  .preset-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  /* === SECTION HEADER === */
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 0 6px 0;
    padding: 6px 0;
    border-bottom: 1px solid var(--border-2);
  }
  .section-header .section-icon {
    font-size: 16px;
  }
  .section-header .section-title {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent);
    font-weight: bold;
    text-transform: uppercase;
  }
  .section-header .section-count {
    color: var(--text-2);
    font-size: 10px;
    margin-left: auto;
  }
  .section-header.fixed .section-title { color: var(--fixed); }

  /* === AFFIX LIST — compact cards === */
  .affixes-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 6px;
  }
  .affix-card {
    background: var(--bg-1);
    border: 1px solid var(--border-2);
    padding: 8px 10px;
    transition: border-color 0.15s;
    border-left: 3px solid var(--text-2);
  }
  .affix-card:hover { border-color: var(--accent); }
  .affix-card.fixed { border-left-color: var(--fixed); }

  .affix-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 4px;
  }
  .affix-name {
    font-size: 12px;
    font-weight: bold;
    color: var(--text-0);
  }
  .affix-pool-badge {
    font-size: 8px;
    letter-spacing: 1px;
    color: var(--text-2);
    text-transform: uppercase;
    flex-shrink: 0;
    background: var(--bg-2);
    padding: 1px 4px;
    border: 1px solid var(--border-1);
  }

  /* Live computed value */
  .affix-value-display {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 179, 71, 0.05);
    border: 1px solid rgba(255, 179, 71, 0.3);
    padding: 4px 8px;
    margin: 4px 0;
  }
  .affix-card.fixed .affix-value-display {
    background: rgba(183, 140, 255, 0.05);
    border-color: rgba(183, 140, 255, 0.3);
  }
  .affix-value-display .lbl {
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--text-1);
    text-transform: uppercase;
  }
  .affix-value-display .val {
    font-size: 14px;
    font-weight: bold;
    color: var(--accent);
  }
  .affix-card.fixed .affix-value-display .val { color: var(--fixed); }

  /* Range mini-bar visualization */
  .range-mini {
    margin-top: 4px;
  }
  .range-bar {
    position: relative;
    height: 4px;
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    margin-top: 2px;
  }
  .range-bar-fill {
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, var(--bad), #ffaa44, var(--good));
    width: 100%;
    opacity: 0.4;
  }
  .range-bar-marker {
    position: absolute;
    top: -2px;
    width: 2px;
    height: 8px;
    background: var(--accent);
    transform: translateX(-1px);
    z-index: 2;
  }
  .range-bounds {
    display: flex;
    justify-content: space-between;
    font-size: 8px;
    color: var(--text-2);
    margin-top: 2px;
  }

  /* Compact info row */
  .affix-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
    font-size: 9px;
    color: var(--text-2);
  }
  .affix-meta .meta-item {
    background: var(--bg-2);
    padding: 1px 5px;
    border: 1px solid var(--border-1);
  }
  .affix-meta .biome-tag {
    border-width: 1px;
    border-style: solid;
  }

  .empty-section {
    padding: 16px;
    text-align: center;
    color: var(--text-2);
    font-size: 11px;
    grid-column: 1 / -1;
  }

  /* === MOBILE === */
  @media (max-width: 600px) {
    .container { padding: 6px; }
    .affixes-list { grid-template-columns: 1fr 1fr; gap: 4px; }
    .ilvl-btn { width: 24px; height: 24px; flex-basis: 24px; font-size: 9px; }
    .title { font-size: 13px; }
    .stats-mini { display: none; }
    .quality-display { font-size: 11px; min-width: 46px; padding: 3px 5px; }
    .affix-value-display .val { font-size: 13px; }
    .controls { padding: 8px; }
    .affix-card { padding: 6px 8px; }
    .affix-name { font-size: 11px; }
    .affix-pool-badge { display: none; }
  }

  @media (max-width: 380px) {
    .affixes-list { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="header">
  <a href="../../index.html" class="back-btn">← RETOUR</a>
  <div class="title"><span class="acc">📜</span> GRIMOIRE</div>
  <div class="stats-mini" id="stats-mini"></div>
</header>

<main class="container">

  <!-- CONTROLS : iLvl + Quality slider -->
  <section class="controls">
    <div class="control-section">
      <div class="control-label">
        <span>▸ NIVEAU D'OBJET (ILVL)</span>
        <span class="val" id="ilvl-display">V</span>
      </div>
      <div class="ilvl-row" id="ilvl-row"></div>
    </div>
    <div class="control-section">
      <div class="control-label">
        <span>▸ SIMULATEUR DE QUALITÉ</span>
        <span class="val"><span id="quality-display">50</span>%</span>
      </div>
      <div class="slider-container">
        <div class="slider-track">
          <div class="slider-bg"></div>
          <input type="range" class="quality-slider" id="quality-slider" min="0" max="100" value="50" step="1">
        </div>
        <div class="quality-display" id="quality-display-side">50%</div>
      </div>
      <div class="preset-row">
        <button class="preset-btn" data-q="0">0%</button>
        <button class="preset-btn" data-q="25">25%</button>
        <button class="preset-btn active" data-q="50">50%</button>
        <button class="preset-btn" data-q="75">75%</button>
        <button class="preset-btn" data-q="85">85%</button>
        <button class="preset-btn" data-q="100">100%</button>
      </div>
    </div>
  </section>

  <!-- ROLLABLES PAR POOL (sections générées dynamiquement) -->
  <div id="pools-container"></div>

  <!-- FIXED SECTION (en bas, séparée car non-rollable concerne tous pools) -->
  <section class="section-header fixed">
    <span class="section-icon">🔒</span>
    <span class="section-title">Affixes Fixes (tous pools)</span>
    <span class="section-count" id="fixed-count"></span>
  </section>
  <section class="affixes-list" id="fixed-list"></section>

</main>

<script type="module">
import { loadCatalog, getAllAffixes, getAffixesByPool, ilvlToRoman } from './items-catalog.js';

// === STATE ===
const STATE = {
  selectedIlvl: 5,
  qualityPct: 50,
};

// === MAPPINGS ===
const BIOME_DATA = {
  inferno:  { id: 'inferno', name: 'Inferno', icon: '🔥', color: '#ff6644' },
  cryo:     { id: 'cryo',    name: 'Cryo',    icon: '❄️', color: '#66bbff' },
  toxic:    { id: 'toxic',   name: 'Toxic',   icon: '☠️', color: '#88dd44' },
  voidnet:  { id: 'voidnet', name: 'Voidnet', icon: '⚡', color: '#aa66ff' },
  crimson:  { id: 'crimson', name: 'Crimson', icon: '🩸', color: '#ff4488' },
};

const POOL_LABELS = {
  elemental: 'Élém',
  physical: 'Phys',
  armor: 'Armure',
  boots: 'Bottes',
  ring: 'Anneau',
  amulet_specific: 'Amulette',
  tome: 'Tome',
  quiver: 'Carquois',
  charger: 'Chargeur',
  shield: 'Bouclier',
  elite: 'Élite',
};

const ILVL_MULT = {
  1: 0.50, 2: 0.65, 3: 0.80, 4: 0.95, 5: 1.00,
  6: 1.15, 7: 1.30, 8: 1.50, 9: 1.75, 10: 2.10,
};

function rangeIsInt(range){
  return Number.isInteger(range[0]) && Number.isInteger(range[1]);
}

/**
 * Calcule la valeur d'un affixe à un % de qualité donné.
 * 0% → vMin × ilvlMult ; 100% → vMax × ilvlMult.
 * Floor selon format du valueRange.
 */
function valueAtQuality(qualityPct, valueRange, ilvl){
  const [vMin, vMax] = valueRange;
  const ilvlMult = ILVL_MULT[ilvl] || 1;
  const t = qualityPct / 100;
  const rawVal = (vMin + t * (vMax - vMin)) * ilvlMult;
  // Round (pas floor) pour cohérence avec items-catalog.js : sur petits ranges comme [1,2]
  // floor donnerait toujours vMin sauf à u=1 strict, ce qui rend vMax inatteignable.
  if(rangeIsInt(valueRange)){
    return Math.max(1, Math.round(rawVal));
  }
  return Math.max(0.1, Math.round(rawVal * 10) / 10);
}

// === BOOT ===
async function boot(){
  await loadCatalog();
  buildIlvlButtons();
  attachHandlers();
  render();
}

function buildIlvlButtons(){
  const row = document.getElementById('ilvl-row');
  for(let lv = 1; lv <= 10; lv++){
    const btn = document.createElement('button');
    btn.className = 'ilvl-btn' + (lv === STATE.selectedIlvl ? ' active' : '');
    btn.textContent = ilvlToRoman(lv);
    btn.dataset.ilvl = lv;
    btn.addEventListener('click', () => {
      STATE.selectedIlvl = lv;
      document.querySelectorAll('.ilvl-btn').forEach(b => b.classList.toggle('active', Number(b.dataset.ilvl) === lv));
      document.getElementById('ilvl-display').textContent = ilvlToRoman(lv);
      render();
    });
    row.appendChild(btn);
  }
}

function attachHandlers(){
  // Quality slider
  const slider = document.getElementById('quality-slider');
  slider.addEventListener('input', () => {
    STATE.qualityPct = Number(slider.value);
    document.getElementById('quality-display').textContent = STATE.qualityPct;
    document.getElementById('quality-display-side').textContent = STATE.qualityPct + '%';
    document.querySelectorAll('.preset-btn').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.q) === STATE.qualityPct);
    });
    render();
  });
  // Preset buttons
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const q = Number(btn.dataset.q);
      STATE.qualityPct = q;
      slider.value = q;
      document.getElementById('quality-display').textContent = q;
      document.getElementById('quality-display-side').textContent = q + '%';
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('active', b === btn));
      render();
    });
  });
}

// === RENDER ===
function render(){
  // Récupère tous les affixes via getAffixesByPool (organisé par pool)
  const byPool = getAffixesByPool();
  const allAffixes = [];
  Object.entries(byPool).forEach(([poolName, entries]) => {
    Object.values(entries).forEach(a => {
      allAffixes.push({ ...a, _pool: poolName });
    });
  });

  // Split rollable / fixed (rollable === false → fixed)
  const rollables = allAffixes.filter(a => a.rollable !== false);
  const fixed = allAffixes.filter(a => a.rollable === false);

  // Group rollables by pool
  const poolGroups = {};
  rollables.forEach(a => {
    if(!poolGroups[a._pool]) poolGroups[a._pool] = [];
    poolGroups[a._pool].push(a);
  });
  // Sort each pool's affixes alphabetically
  Object.values(poolGroups).forEach(list => list.sort((a, b) => a.name.localeCompare(b.name)));

  // Sort fixes
  fixed.sort((a, b) => a.name.localeCompare(b.name));

  // Update header count (total)
  document.getElementById('stats-mini').textContent = `${allAffixes.length} affixes (${rollables.length} ⚙ + ${fixed.length} 🔒)`;
  document.getElementById('fixed-count').textContent = `${fixed.length} affixes`;

  // Render rollables sections (1 par pool, dans l'ordre logique)
  renderRollableSections(poolGroups);

  // Render fixed section
  const fixedList = document.getElementById('fixed-list');
  if(fixed.length === 0){
    fixedList.innerHTML = '<div class="empty-section">Aucun affixe fixe</div>';
  } else {
    fixedList.innerHTML = fixed.map(a => renderAffixCard(a, true)).join('');
  }
}

// Ordre d'affichage des pools dans le grimoire (le plus pertinent en haut)
const POOL_ORDER = [
  'physical', 'elemental', 'armor', 'boots', 'ring',
  'amulet_specific', 'tome', 'shield', 'quiver', 'charger', 'elite',
];
const POOL_ICONS = {
  physical: '⚔️', elemental: '🔥', armor: '🛡️', boots: '👢',
  ring: '💍', amulet_specific: '📿', tome: '📚',
  shield: '🛡', quiver: '🏹', charger: '🔋', elite: '★',
};

function renderRollableSections(poolGroups){
  const container = document.getElementById('pools-container');
  let html = '';

  // Pools dans l'ordre, puis ceux qui restent (cas où on aurait oublié un pool dans POOL_ORDER)
  const orderedKeys = POOL_ORDER.filter(p => poolGroups[p] && poolGroups[p].length > 0);
  const remainingKeys = Object.keys(poolGroups).filter(p => !orderedKeys.includes(p));
  const allKeys = [...orderedKeys, ...remainingKeys];

  for(const poolName of allKeys){
    const list = poolGroups[poolName];
    const icon = POOL_ICONS[poolName] || '◆';
    const label = POOL_LABELS[poolName] || poolName;

    html += `
      <section class="section-header">
        <span class="section-icon">${icon}</span>
        <span class="section-title">${label}</span>
        <span class="section-count">${list.length} affixes</span>
      </section>
      <section class="affixes-list">
        ${list.map(a => renderAffixCard(a, false)).join('')}
      </section>
    `;
  }

  container.innerHTML = html;
}

function renderAffixCard(affix, isFixed){
  const ilvl = STATE.selectedIlvl;
  const q = isFixed ? 100 : STATE.qualityPct; // Fixe toujours affiché à 100%
  const value = valueAtQuality(q, affix.valueRange, ilvl);
  const minVal = valueAtQuality(0, affix.valueRange, ilvl);
  const maxVal = valueAtQuality(100, affix.valueRange, ilvl);
  const labelWithValue = (affix.label || '').replace('X', value);
  const poolLbl = POOL_LABELS[affix._pool] || affix._pool;

  // Biome
  let biomeTag = '';
  if(affix.biome && BIOME_DATA[affix.biome]){
    const b = BIOME_DATA[affix.biome];
    biomeTag = `<span class="meta-item biome-tag" style="color: ${b.color}; border-color: ${b.color};">${b.icon} ${b.name}</span>`;
  }

  const eliteBadge = affix.isElite ? `<span class="meta-item" style="color: var(--accent); border-color: var(--accent);">★ Élite</span>` : '';

  // Range bar (only for rollables)
  let rangeBar = '';
  if(!isFixed){
    rangeBar = `
      <div class="range-mini">
        <div class="range-bar">
          <div class="range-bar-fill"></div>
          <div class="range-bar-marker" style="left: ${q}%;"></div>
        </div>
        <div class="range-bounds">
          <span>${minVal}</span>
          <span>${maxVal}</span>
        </div>
      </div>
    `;
  }

  return `
    <div class="affix-card ${isFixed ? 'fixed' : ''}">
      <div class="affix-header">
        <div class="affix-name">${affix.name}</div>
        <span class="affix-pool-badge">${poolLbl}</span>
      </div>
      <div class="affix-value-display">
        <span class="lbl">${isFixed ? 'Effet' : `À ${q}%`}</span>
        <span class="val">${labelWithValue}</span>
      </div>
      ${rangeBar}
      <div class="affix-meta">
        ${biomeTag}
        ${eliteBadge}
      </div>
    </div>
  `;
}

boot().catch(e => {
  console.error('Boot failed:', e);
  document.body.innerHTML = `<div style="padding:40px;color:#ff5959;font-family:monospace;">Erreur de chargement: ${e.message}</div>`;
});
</script>

</body>
</html>
